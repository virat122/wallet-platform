version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: wallet-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: walletdb
      MYSQL_USER: walletuser
      MYSQL_PASSWORD: walletpass
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: wallet-adminer
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - '8080:8080'
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_PORT: 8080

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: wallet-auth-service
    restart: unless-stopped
    environment:
      PORT: 4001
      NODE_ENV: development
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: walletuser
      DB_PASSWORD: walletpass
      DB_NAME: walletdb
      DB_CONNECTION_LIMIT: 10
      JWT_ACCESS_SECRET: dev-access-secret
      JWT_REFRESH_SECRET: dev-refresh-secret
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      BCRYPT_SALT_ROUNDS: 12
    ports:
      - '4001:4001'
    depends_on:
      - mysql

volumes:
  mysql_data:
